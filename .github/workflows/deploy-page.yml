name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

# id-token can't be self-granted by the reusable workflow — it has to be declared here.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  pages:
    uses: Delwing/mudlet-map-page/.github/workflows/deploy-pages.yml@v1
    with:
      map-file: map_master3.dat
      # Track the latest 1.x bundle from jsDelivr rather than pinning a patch.
      version: "1"
      lang: pl
      # Sets the document <title>; MAP_CONFIG.title is replaced by the per-language
      # object in extra-config below.
      title: Mapa Arkadii
      logo: page/images/logo.png
      npc-url: page/data/npc.json
      favicon: page/favicon.ico
      # title and credits.remark are per-language objects, which the plain-string
      # `title`/`credits-*` inputs can't express — extra-config is merged in last.
      extra-config: |
        {
          "title": { "pl": "Mapa Arkadii", "en": "Arkadia Map" },
          "credits": {
            "author": "Dargoth",
            "githubUrl": "https://github.com/Delwing/mudlet-map-reader",
            "remark": {
              "pl": "Mapa powstała przy współpracy wielu osób ze społeczności Arkadii w projekcie <b>dzordzyka</b>",
              "en": "Map was created by many authors from Arkadia's communities in project under lead of <b>dzordzyk</b>"
            }
          }
        }
      # Adds the Google Analytics tag; the action's inputs don't cover analytics.
      html-transform: action/page-transform.mjs
